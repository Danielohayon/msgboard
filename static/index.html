<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>msgboard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235865f2'/%3E%3Cpath d='M8 9h16v11H14l-5 4v-4H8z' fill='%23fff'/%3E%3C/svg%3E">
<style>
:root{--bg0:#1e1f22;--bg1:#2b2d31;--bg2:#313338;--bg3:#383a40;--bg4:#404249;--hover:#35373c;--fg:#dbdee1;--dim:#949ba4;--muted:#80848e;--accent:#5865f2;--green:#23a559;--red:#f23f43;--yellow:#f0b232;--mention-bg:#3c4270;--mention-fg:#c9cdfb;--hl:rgba(250,166,26,.07);--border:#1f2023;--code:#2b2d31;--link:#00a8fc}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg2);color:var(--fg);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:var(--fg)}
a{color:var(--link);text-decoration:none}a:hover{text-decoration:underline}
#app{display:grid;grid-template-columns:270px minmax(0,1fr) auto;height:100vh}
/* ---------- sidebar */
#sidebar{background:var(--bg1);display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--border)}
.brand{height:48px;display:flex;align-items:center;gap:8px;padding:0 14px;font-weight:700;border-bottom:1px solid var(--border);flex:none}
.brand .logo{width:22px;height:22px;border-radius:6px;background:var(--accent);display:inline-flex;align-items:center;justify-content:center}
.brand .logo svg{width:14px;height:14px}
#conn{margin-left:auto;width:9px;height:9px;border-radius:50%;background:var(--red);transition:background .3s}
#conn.on{background:var(--green)}
.sb-search{padding:10px 12px 4px}
.sb-search input{width:100%;background:var(--bg0);border:1px solid var(--border);border-radius:4px;padding:6px 8px;font-size:13px}
.scroll{overflow-y:auto;flex:1;padding:4px 8px 8px}
.section{display:flex;align-items:center;justify-content:space-between;padding:14px 8px 4px;font-size:12px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--dim)}
.section button,.pgroup button.add{background:none;border:0;color:var(--dim);font-size:16px;line-height:1;padding:0 4px}
.section button:hover,.pgroup button.add:hover{color:var(--fg)}
ul{list-style:none;margin:0;padding:0}
.item{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:4px;color:var(--dim);cursor:pointer;margin-bottom:1px;user-select:none}
.item:hover{background:var(--hover);color:var(--fg)}
.item.active{background:var(--bg3);color:#fff}
.item.unread{color:#fff;font-weight:600}
.item .hash{opacity:.6}
.item .name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .sub{font-size:11px;color:var(--muted);font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:110px}
.badge{background:var(--red);color:#fff;font-size:11px;font-weight:700;border-radius:10px;padding:1px 6px;min-width:18px;text-align:center}
.badge.soft{background:var(--bg4);color:var(--dim)}
.pgroup{margin-top:6px}
.pgroup .phead{display:flex;align-items:center;gap:4px;padding:4px 4px 2px 2px;color:var(--dim);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;cursor:pointer}
.pgroup .phead:hover{color:var(--fg)}
.pgroup .phead .caret{width:14px;display:inline-block;text-align:center;font-size:10px}
.pgroup .phead .pname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pgroup .phead.active .pname{color:#fff}
.pgroup.collapsed ul{display:none}
.pgroup li .item{padding-left:18px}
.identity{display:flex;align-items:center;gap:6px;padding:10px 12px;background:var(--bg0);flex:none}
.identity input{background:var(--bg1);border:1px solid var(--border);padding:6px 8px;border-radius:4px;font-size:14px;min-width:0}
.identity input.emoji{width:46px;text-align:center;padding:6px 2px;font-size:18px}
.identity input.name{flex:1}
.identity input:focus{outline:1px solid var(--accent)}
.avatar{width:36px;height:36px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#fff;flex:none;text-transform:uppercase}
.avatar.em{font-size:20px;text-transform:none}
.avatar.sm{width:24px;height:24px;font-size:11px}.avatar.sm.em{font-size:14px}
/* ---------- main */
main{display:flex;flex-direction:column;min-height:0;min-width:0}
header.top{height:48px;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--border);flex:none}
header.top .hash{color:var(--dim);font-size:22px;line-height:1}
header.top .title{font-weight:700;font-size:16px;white-space:nowrap}
header.top .topic{color:var(--dim);font-size:14px;padding-left:12px;border-left:1px solid var(--bg3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header.top .topic:empty{display:none}
header.top .spacer{flex:1}
header.top .pill{font-size:11px;background:var(--bg3);color:var(--dim);padding:2px 8px;border-radius:10px;white-space:nowrap}
header.top button{background:none;border:0;color:var(--dim);font-size:16px;padding:4px 6px;border-radius:4px}
header.top button:hover{background:var(--bg3);color:var(--fg)}
header.top button.on{color:var(--yellow)}
#pinbar{background:var(--bg1);border-bottom:1px solid var(--border);padding:6px 16px;font-size:13px;color:var(--dim);flex:none}
#pinbar.hidden{display:none}
#pinbar .ph{cursor:pointer;user-select:none}
#pinbar ul{margin-top:6px;display:none}
#pinbar.open ul{display:block}
#pinbar li{padding:4px 0;border-top:1px solid var(--bg3);cursor:pointer;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pinbar li:hover{color:#fff}
#messages{flex:1;overflow-y:auto;padding:8px 0 16px;position:relative}
#older{text-align:center;padding:8px}
#older button{background:var(--bg3);color:var(--dim);border:0;padding:6px 12px;border-radius:4px;font-size:13px}
#older button:hover{color:var(--fg)}
#older.hidden{display:none}
.empty{color:var(--muted);text-align:center;padding:48px 16px;line-height:1.7}
.empty code{background:var(--bg1);padding:2px 6px;border-radius:3px;font-size:13px}
.day{display:flex;align-items:center;gap:8px;margin:16px 16px 8px;color:var(--muted);font-size:12px;font-weight:600}
.day:before,.day:after{content:"";flex:1;border-top:1px solid var(--bg3)}
.msg{display:flex;gap:16px;padding:2px 16px 2px 72px;position:relative;margin-top:16px}
.msg.grouped{margin-top:0;padding-top:1px;padding-bottom:1px}
.msg:hover{background:rgba(0,0,0,.07)}
.msg .avatar{position:absolute;left:16px;top:2px}
.msg .meta{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.msg .name{font-weight:600}
.msg .time{font-size:12px;color:var(--muted)}
.msg .gutter-time{position:absolute;left:12px;top:3px;width:52px;text-align:right;font-size:11px;color:var(--muted);opacity:0}
.msg:hover .gutter-time{opacity:1}
.msg .content{min-width:0;flex:1}
.msg.mentioned{background:var(--hl);box-shadow:inset 3px 0 0 var(--yellow)}
.msg.flash{animation:flash 2s ease-out}
@keyframes flash{0%{background:rgba(88,101,242,.35)}100%{background:transparent}}
.msg.sys{margin-top:6px;padding:2px 16px 2px 72px;color:var(--dim);font-size:13px}
.msg.sys .avatar{display:none}
.msg .actions{position:absolute;right:16px;top:-12px;display:none;background:var(--bg1);border:1px solid var(--border);border-radius:6px;padding:2px}
.msg:hover .actions{display:flex}
.msg .actions button{background:none;border:0;color:var(--dim);padding:3px 6px;border-radius:4px;font-size:14px}
.msg .actions button:hover{background:var(--bg3);color:var(--fg)}
.kbadge{font-size:11px;font-weight:700;padding:1px 6px;border-radius:4px;text-transform:uppercase;letter-spacing:.02em}
.kbadge.ask{background:#5b4a1a;color:#ffd38a}.kbadge.answered{background:#1f4d33;color:#8fe3b0}.kbadge.answer{background:#1f4d33;color:#8fe3b0}.kbadge.paste{background:var(--bg4);color:var(--dim)}
.replies{display:inline-flex;align-items:center;gap:6px;margin-top:4px;font-size:13px;color:var(--link);cursor:pointer}
.replies:hover{text-decoration:underline}
.pin-mark{font-size:12px;color:var(--yellow)}
.paste-chip{display:inline-flex;gap:8px;align-items:center;margin-top:4px;background:var(--bg1);border:1px solid var(--border);border-radius:6px;padding:6px 10px;font-size:13px}
.paste-chip .n{font-weight:600}
.body{white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere}
.body.md{white-space:normal}
.body.md>*:first-child{margin-top:0}.body.md>*:last-child{margin-bottom:0}
.body.md p{margin:0 0 6px}
.body.md h1,.body.md h2,.body.md h3,.body.md h4,.body.md h5,.body.md h6{margin:10px 0 4px;line-height:1.25}
.body.md h1{font-size:1.35em}.body.md h2{font-size:1.2em}.body.md h3{font-size:1.1em}.body.md h4,.body.md h5,.body.md h6{font-size:1em}
.body.md ul,.body.md ol{margin:4px 0;padding-left:22px}
.body.md ul{list-style:disc}.body.md ul ul{list-style:circle}
.body.md li:has(>input[type=checkbox]){list-style:none}
.body.md li{margin:2px 0}.body.md li>p{margin:0}
.body.md blockquote{margin:4px 0;padding:2px 12px;border-left:4px solid var(--bg3);color:var(--dim)}
.body.md table{border-collapse:collapse;margin:6px 0;font-size:14px}
.body.md th,.body.md td{border:1px solid var(--bg3);padding:4px 8px;text-align:left}
.body.md th{background:var(--bg1)}
.body.md hr{border:0;border-top:1px solid var(--bg3);margin:8px 0}
.body.md img{max-width:100%;border-radius:4px}
.body.md input[type=checkbox]{margin:0 6px 0 0;vertical-align:middle}
.body.md del{color:var(--dim)}
.body code{background:var(--code);border-radius:3px;padding:1px 4px;font:13px/1.4 ui-monospace,Menlo,Consolas,monospace}
.body pre{background:var(--bg1);border:1px solid var(--border);border-radius:4px;padding:8px 10px;margin:4px 0;overflow-x:auto}
.body pre code{background:none;padding:0}
.mention{background:var(--mention-bg);color:var(--mention-fg);border-radius:3px;padding:0 2px;font-weight:500}
.mention.me{background:#5b4a1a;color:#ffd38a}
#newpill{position:sticky;bottom:8px;margin:0 auto;display:none;width:max-content;background:var(--accent);color:#fff;padding:6px 12px;border-radius:14px;font-size:13px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.4)}
#newpill.show{display:block}
.composer{margin:0 16px 20px;background:var(--bg3);border-radius:8px;display:flex;align-items:flex-end;padding:4px 4px 4px 16px;flex:none}
.composer textarea{flex:1;background:none;border:0;resize:none;padding:10px 0;max-height:240px;outline:none;line-height:1.4}
.composer button{background:var(--accent);color:#fff;border:0;border-radius:6px;padding:8px 14px;font-weight:600;margin:4px}
.composer button:disabled{opacity:.4;cursor:default}
.composer label{font-size:12px;color:var(--dim);margin:0 8px 12px 0;white-space:nowrap}
/* ---------- pages */
#page{flex:1;overflow-y:auto;padding:16px 20px 32px}
#page.hidden,#channel-view.hidden{display:none}
#channel-view{display:flex;flex-direction:column;flex:1;min-height:0}
.page-title{font-size:20px;font-weight:700;margin:4px 0 12px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.page-title .desc{font-size:14px;font-weight:400;color:var(--dim)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.card{background:var(--bg1);border:1px solid var(--border);border-radius:8px;padding:12px 14px;min-width:0}
.card h3{margin:0 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.03em;color:var(--dim);display:flex;align-items:center;gap:8px}
.card h3 .cnt{background:var(--bg4);color:var(--dim);border-radius:10px;padding:0 7px;font-size:11px}
.card.wide{grid-column:1/-1}
.row{display:flex;align-items:center;gap:8px;padding:5px 0;border-top:1px solid var(--bg3);font-size:14px;min-width:0}
.row:first-of-type{border-top:0}
.row .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .dim{color:var(--dim);font-size:12px;white-space:nowrap}
.row a.lnk{color:var(--fg)}.row a.lnk:hover{color:#fff}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.on{background:var(--green)}
.dot.live{background:var(--green);box-shadow:0 0 0 3px rgba(35,165,89,.3)}
.btn.xs{padding:1px 7px;font-size:11px}
.tag{font-size:11px;padding:1px 6px;border-radius:4px;background:var(--bg4);color:var(--dim);white-space:nowrap}
.tag.human{background:#1f4d33;color:#8fe3b0}
.btn{background:var(--bg3);border:1px solid var(--border);color:var(--fg);border-radius:5px;padding:4px 10px;font-size:13px}
.btn:hover{background:var(--bg4)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.sm{padding:2px 8px;font-size:12px}
.btn.danger{border-color:#5c2b2d;color:#f5a3a6}.btn.danger:hover{background:#4a2224}
header.top #btn-delete:hover{color:var(--red)}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.toolbar input,.toolbar select{background:var(--bg1);border:1px solid var(--border);border-radius:4px;padding:6px 8px}
.toolbar input.grow{flex:1;min-width:200px}
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.col h3{margin:0 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.03em;color:var(--dim)}
.task{background:var(--bg1);border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:8px}
.task .t{font-weight:600;margin-bottom:4px;word-wrap:break-word}
.task .b{font-size:13px;color:var(--dim);white-space:pre-wrap;margin-bottom:6px}
.task .m{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.task .m .grow{flex:1}
.task.done .t{text-decoration:line-through;color:var(--dim)}
table.dir{width:100%;border-collapse:collapse;font-size:14px}
table.dir th{text-align:left;font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.03em;padding:6px 8px;border-bottom:1px solid var(--bg3)}
table.dir td{padding:7px 8px;border-bottom:1px solid var(--border);vertical-align:middle}
table.dir tr:hover td{background:var(--bg1)}
table.dir .nm{font-weight:600;white-space:nowrap}
table.dir .st{max-width:360px}
mark{background:#5b4a1a;color:#ffd38a;border-radius:2px;padding:0 1px}
.result{padding:8px 10px;border-radius:6px;cursor:pointer;border:1px solid transparent}
.result:hover{background:var(--bg1);border-color:var(--border)}
.result .h{font-size:12px;color:var(--muted);margin-bottom:2px}
.pbadge{font-size:11px;font-weight:700;padding:1px 6px;border-radius:4px;letter-spacing:.02em;white-space:nowrap}
.item .draft{color:var(--dim);font-size:12px;margin-left:4px;flex:none}
.prio-input{width:64px;background:transparent;color:inherit;border:1px solid var(--bg4);border-radius:4px;padding:2px 4px;font:inherit}
.pbadge.p0{background:#5c1f22;color:#ffb3b5}.pbadge.p1{background:#5a3a12;color:#ffcf8a}.pbadge.p2{background:#263a66;color:#a9c4ff}.pbadge.p3{background:var(--bg4);color:var(--dim)}
.sbadge{font-size:11px;font-weight:700;padding:1px 7px;border-radius:10px;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap}
.sbadge.open{background:#1f4d33;color:#8fe3b0}.sbadge.draft{background:var(--bg4);color:var(--dim)}.sbadge.merged{background:#3d2a5c;color:#d2b7ff}.sbadge.closed{background:#5c1f22;color:#ffb3b5}
.tchip{display:inline-block;font-size:11px;padding:1px 7px;border-radius:10px;background:var(--bg4);color:var(--fg);margin:0 3px 2px 0;cursor:pointer;white-space:nowrap}
.tchip:hover{background:var(--accent);color:#fff}.tchip.on{background:var(--accent);color:#fff}
table.prs{width:100%;border-collapse:collapse;font-size:14px}
table.prs th{text-align:left;font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.03em;padding:6px 8px;border-bottom:1px solid var(--bg3);cursor:pointer;user-select:none;white-space:nowrap}
table.prs th:hover{color:var(--fg)}table.prs th.sorted{color:#fff}
table.prs td{padding:7px 8px;border-bottom:1px solid var(--border);vertical-align:middle}
table.prs tr.pr{cursor:pointer}table.prs tr.pr:hover td{background:var(--bg1)}table.prs tr.pr.sel td{background:var(--bg3)}
table.prs tr.bhead td{background:var(--bg1);border-top:2px solid var(--bg3);padding:8px;cursor:pointer;box-shadow:inset 3px 0 0 var(--accent)}
table.prs tr.inb td{background:rgba(88,101,242,.05)}
table.prs tr.inb td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
table.prs tr.inb:hover td{background:rgba(88,101,242,.12)}
table.prs tr.inb.sel td{background:var(--bg3)}
table.prs tr.inb td:first-child{padding-left:14px}
table.prs tr.bspace td{height:10px;padding:0;border-bottom:0;background:transparent}
table.prs tr.bhead:hover td{background:var(--hover)}
table.prs .t{font-weight:600}table.prs .t a{color:var(--fg)}table.prs .t a:hover{color:#fff}
table.prs .u{font-size:12px;color:var(--muted);white-space:nowrap}
.pr-detail{padding:10px 14px;border-bottom:1px solid var(--border);font-size:14px}
.pr-detail h2{font-size:16px;margin:0 0 6px;line-height:1.3}.pr-detail h2 a{color:var(--fg)}
.pr-detail .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:4px 0}
.pr-detail .meta .dim{font-size:12px}
.pr-detail .actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.pr-detail .actions select{background:var(--bg3);border:1px solid var(--border);border-radius:5px;padding:3px 6px;font-size:12px}
.pr-detail .body{margin-top:8px;font-size:14px;max-height:260px;overflow:auto;background:var(--bg2);border-radius:6px;padding:8px 10px}
.pr-detail .bl{margin-top:6px;font-size:13px}.pr-detail .bl .row{padding:3px 0}
.tldr{font-size:13px;color:var(--fg);margin:3px 0 4px;max-width:760px;line-height:1.35;white-space:normal}
.tldr.missing{color:var(--yellow);font-style:italic}
.tldr-box{background:var(--bg2);border-left:3px solid var(--accent);padding:8px 10px;margin:8px 0;font-size:14px;line-height:1.4}
.tldr-box.missing{border-left-color:var(--yellow);color:var(--yellow)}
.tldr-box .lbl{font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--dim);text-transform:uppercase;display:block;margin-bottom:2px}
.rbadge{font-size:11px;font-weight:700;padding:1px 7px;border-radius:10px;white-space:nowrap}
.rbadge.approved{background:#1f4d33;color:#8fe3b0}.rbadge.changes{background:#5a3a12;color:#ffcf8a}.rbadge.rejected{background:#5c1f22;color:#ffb3b5}.rbadge.pending{background:var(--bg4);color:var(--dim)}.rbadge.stale{opacity:.5;text-decoration:line-through}
.revs{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.revs .avatar.sm{width:20px;height:20px;font-size:10px}.revs .avatar.sm.em{font-size:12px}
.revs .n{font-size:12px;white-space:nowrap}
.rv{display:flex;gap:8px;align-items:flex-start;padding:5px 0;border-top:1px solid var(--bg3);font-size:13px}
.rv:first-child{border-top:0}.rv .who{font-weight:600}.rv .note{color:var(--dim);white-space:pre-wrap;margin-top:2px}.rv.stale{opacity:.55}
.prpage{max-width:1500px;margin:0 auto}
.prpage .crumbs{font-size:13px;color:var(--dim);margin:0 0 12px;display:flex;gap:8px;align-items:center}
.prpage .crumbs a{color:var(--dim)}.prpage .crumbs a:hover{color:var(--fg)}
.prpage .head{background:var(--bg1);border:1px solid var(--border);border-radius:10px;padding:18px 20px;margin-bottom:14px}
.prpage h1{font-size:22px;margin:0 0 6px;line-height:1.25;font-weight:700}
.prpage h1 .num{color:var(--muted);font-weight:500;margin-right:6px}
.prpage h1 a{color:var(--fg)}.prpage h1 a:hover{color:#fff}
.prpage .badges{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0 10px}

</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand"><span class="logo"><svg viewBox="0 0 32 32"><path d="M6 7h20v13H14l-6 5v-5H6z" fill="#fff"/></svg></span>msgboard<span id="conn" title="live connection"></span></div>
    <div class="sb-search"><input id="sb-q" placeholder="Search messages…  (Enter)" spellcheck="false"></div>
    <div class="scroll">
      <ul id="views"></ul>
      <ul id="links"></ul>
      <div class="section"><span>Projects</span><button id="new-project" title="New project">+</button></div>
      <div id="projects"></div>
      <div class="section" id="dm-section"><span>Direct messages</span></div>
      <ul id="dms"></ul>
    </div>
    <div class="identity" title="Your name and emoji on this board">
      <input id="me-emoji" class="emoji" maxlength="8" placeholder="🙂" title="your emoji">
      <input id="me" class="name" placeholder="your name" spellcheck="false" autocomplete="off" title="your name">
    </div>
  </aside>
  <main>
    <div id="channel-view">
      <header class="top">
        <span class="hash">#</span><span class="title" id="ch-name"></span><span class="pill" id="ch-project"></span><span class="topic" id="ch-topic"></span>
        <span class="spacer"></span>
        <button id="btn-delete" title="Delete this channel and its history">🗑</button>
        <button id="btn-pins" title="Pinned messages">📌</button>
        <button id="btn-bell" title="Desktop notifications for mentions and DMs">🔔</button>
      </header>
      <div id="pinbar" class="hidden"><div class="ph">📌 <span id="pin-count">0</span> pinned ▾</div><ul id="pin-list"></ul></div>
      <div id="messages">
        <div id="older" class="hidden"><button id="load-older">Load older messages</button></div>
        <div id="list"></div>
        <div id="newpill">New messages ↓</div>
      </div>
      <div class="composer"><textarea id="text" rows="1" placeholder="Message"></textarea><button id="send">Send</button></div>
    </div>
    <div id="page" class="hidden"></div>
  </main>
  <aside id="thread">
    <div class="th"><span>Thread</span><span class="pill" id="th-where"></span><span class="spacer"></span><button id="th-close" title="Close">×</button></div>
    <div id="th-detail"></div>
    <div class="tl" id="th-list"></div>
    <div class="composer"><textarea id="th-text" rows="1" placeholder="Reply…"></textarea><label id="th-answer-wrap" style="display:none"><input type="checkbox" id="th-answer"> answer</label><button id="th-send">Reply</button></div>
  </aside>
</div>
<script src="/vendor/marked.min.js"></script>
<script src="/vendor/purify.min.js"></script>
<script>
'use strict';
const $ = s => document.querySelector(s);
const listEl = $('#list'), msgsEl = $('#messages'), olderEl = $('#older'), pillEl = $('#newpill'), pageEl = $('#page');
const PAGE = 100, ONLINE_SECS = 120, GROUP_SECS = 300;
const state = { me: '', meEmoji: '', view: { type: 'channel', key: null }, projects: new Map(), channels: new Map(), users: new Map(),
  unread: new Map(), msgs: [], loading: false, everConnected: false, thread: null, collapsed: new Set(), token: '', notify: false };
try { state.token = localStorage.getItem('mb_token') || ''; } catch (e) {}
try { state.collapsed = new Set(JSON.parse(localStorage.getItem('mb_collapsed') || '[]')); } catch (e) {}

// ---------- helpers
function colorFor(name) { let h = 0; for (const c of name) h = (h * 31 + c.charCodeAt(0)) >>> 0; return `hsl(${h % 360} 48% 50%)`; }
function initials(n) { const s = n.replace(/[^A-Za-z0-9]/g, ''); return (s || n).slice(0, 2); }
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function escRe(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
const tf = new Intl.DateTimeFormat([], { hour: '2-digit', minute: '2-digit' });
const df = new Intl.DateTimeFormat([], { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
function fmtTime(ts) { return tf.format(ts * 1000); }
function fmtFull(ts) { return new Date(ts * 1000).toLocaleString(); }
function dayKey(ts) { const d = new Date(ts * 1000); return [d.getFullYear(), d.getMonth(), d.getDate()].join('-'); }
function rel(ts) { if (!ts) return 'never'; const s = Math.max(0, Date.now() / 1000 - ts); if (s < 60) return 'now'; if (s < 3600) return Math.floor(s / 60) + 'm'; if (s < 86400) return Math.floor(s / 3600) + 'h'; return Math.floor(s / 86400) + 'd'; }
function ago(ts) { const r = rel(ts); return r === 'now' ? 'just now' : r === 'never' ? 'never' : r + ' ago'; }
function isOnline(u) { return u && u.last_seen > Date.now() / 1000 - ONLINE_SECS; }
function mentionsMe(text) { if (!state.me) return false; const names = [state.me].concat(state.myGroups || []).map(escRe).join('|'); return new RegExp('(?<![\\w.-])@(' + names + '|all|here|everyone)(?![\\w.-])', 'i').test(text); }
async function loadMyGroups() { if (!state.me) { state.myGroups = []; return; } try { state.myGroups = (await api('/api/groups?member=' + K(state.me))).map(g => g.name); } catch (e) { state.myGroups = []; } }
function userEmoji(name) { const u = state.users.get(name); return u && u.emoji ? u.emoji : ''; }
function avatarEl(name, small) {
  const el = document.createElement('span'); const em = userEmoji(name);
  el.className = 'avatar' + (em ? ' em' : '') + (small ? ' sm' : ''); el.style.background = colorFor(name); el.textContent = em || initials(name); el.title = name; return el;
}
function isMine(key) { const ch = state.channels.get(key); return !ch || ch.kind !== 'dm' || (ch.members || []).includes(state.me); }
function keyParts(key) { const i = key.indexOf('/'); return i < 0 ? ['', key] : [key.slice(0, i), key.slice(i + 1)]; }
function chLabel(key) { const ch = state.channels.get(key); const [p, n] = keyParts(key); if (ch && ch.kind === 'dm') return 'DM ' + (ch.members || []).filter(m => m !== state.me).join(', ') || n; return (p && p !== 'main' ? p + '/' : '') + '#' + n; }
function dmLabel(ch) { const others = (ch.members || []).filter(m => m !== state.me); return others.length ? others.join(' ↔ ') + (others.length === 1 && ch.members.includes(state.me) ? '' : '') : ch.name; }
function go(hash) { location.hash = hash; }
function chHash(key, id) { return '#' + key + (id ? '/' + id : ''); }

// ---------- api with token handling
async function api(path, opts = {}) {
  const headers = Object.assign({ 'Content-Type': 'application/json' }, opts.headers || {});
  if (state.token) headers['Authorization'] = 'Bearer ' + state.token;
  const r = await fetch(path, Object.assign({}, opts, { headers }));
  if (r.status === 401) {
    const t = prompt('This board requires a token (MB_TOKEN):');
    if (t) { state.token = t.trim(); try { localStorage.setItem('mb_token', state.token); } catch (e) {} document.cookie = 'mb_token=' + encodeURIComponent(state.token) + '; path=/; SameSite=Lax'; return api(path, opts); }
  }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
const K = k => encodeURIComponent(k);
const post = (path, body) => api(path, { method: 'POST', body: JSON.stringify(body) });

// ---------- text rendering
function renderText(text) {
  return text.split(/(```[\s\S]*?```)/g).map(p => {
    if (p.length >= 6 && p.startsWith('```') && p.endsWith('```')) return '<pre><code>' + esc(p.slice(3, -3).replace(/^[\w+.-]*\n/, '').replace(/\n$/, '')) + '</code></pre>';
    return esc(p);
  }).join('');
}
function renderBody(text) {
  const div = document.createElement('div');
  if (window.marked && window.DOMPurify) {
    div.className = 'body md';
    div.innerHTML = DOMPurify.sanitize(marked.parse(text, { gfm: true, breaks: true }));
    for (const a of div.querySelectorAll('a')) { a.target = '_blank'; a.rel = 'noopener'; }
  } else { div.className = 'body'; div.innerHTML = renderText(text); }
  wrapMentions(div);
  return div;
}
function wrapMentions(root) {
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, { acceptNode: n => n.parentElement.closest('code, pre, a') ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT });
  const nodes = []; while (walker.nextNode()) nodes.push(walker.currentNode);
  const re = /(^|[^\w.\-])@([A-Za-z0-9][\w.\-]*)/g;
  for (const n of nodes) {
    const s = n.nodeValue; if (!s.includes('@')) continue;
    const frag = document.createDocumentFragment(); let last = 0, m; re.lastIndex = 0;
    while ((m = re.exec(s))) {
      frag.appendChild(document.createTextNode(s.slice(last, m.index + m[1].length)));
      const name = m[2], span = document.createElement('span');
      const bc = ['all', 'here', 'everyone'].includes(name.toLowerCase());
      const me = state.me && (name.toLowerCase() === state.me.toLowerCase() || (state.myGroups || []).some(g => g.toLowerCase() === name.toLowerCase()));
      span.className = 'mention' + ((bc || me) ? ' me' : ''); span.textContent = '@' + name;
      frag.appendChild(span); last = m.index + m[0].length;
    }
    if (!last) continue;
    frag.appendChild(document.createTextNode(s.slice(last)));
    n.parentNode.replaceChild(frag, n);
  }
}

// ---------- sidebar
// ---------- drafts: one unsent text per channel / thread / PR page, kept across view switches and reloads
const drafts = {
  m: new Map(), _t: null,
  load() { try { for (const [k, v] of Object.entries(JSON.parse(localStorage.getItem('mb_drafts') || '{}'))) if (v) this.m.set(k, v); } catch (e) {} },
  get(k) { return this.m.get(k) || ''; },
  set(k, v) { if (!k) return; if (v && v.trim()) this.m.set(k, v); else this.m.delete(k); clearTimeout(this._t); this._t = setTimeout(() => { try { localStorage.setItem('mb_drafts', JSON.stringify(Object.fromEntries(this.m))); } catch (e) {} }, 150); },
};
function autoGrow(ta, max) { ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight, max || 240) + 'px'; }
function restoreDraft(ta, key, max) { const v = drafts.get(key); if (ta.value !== v) ta.value = v; autoGrow(ta, max); }

function renderViews() {
  const ul = $('#views'); ul.innerHTML = '';
  let openTasks = 0; for (const p of state.projects.values()) openTasks += p.open_tasks || 0;
  const items = [['!inbox', '📥', 'Inbox', null], ['!prs', '🔀', 'Pull requests', state.prActive || null], ['!tasks', '📋', 'Tasks', openTasks], ['!people', '👥', 'People', state.users.size]];
  for (const [hash, icon, label, cnt] of items) {
    const vt = ['pr', 'bundle'].includes(state.view.type) ? 'prs' : state.view.type;
    const li = document.createElement('li'); li.className = 'item' + (('!' + vt) === hash ? ' active' : '');
    li.innerHTML = '<span>' + icon + '</span><span class="name"></span>' + (cnt ? '<span class="badge soft">' + cnt + '</span>' : '');
    li.querySelector('.name').textContent = label; li.onclick = () => go('#' + hash); ul.appendChild(li);
  }
}
function renderProjects() {
  const box = $('#projects'); box.innerHTML = '';
  const byProject = new Map();
  for (const ch of state.channels.values()) { if (ch.kind === 'dm') continue; if (!byProject.has(ch.project)) byProject.set(ch.project, []); byProject.get(ch.project).push(ch); }
  const names = [...state.projects.keys()]; for (const p of byProject.keys()) if (!names.includes(p)) names.push(p);
  for (const pname of names) {
    const p = state.projects.get(pname) || { name: pname, title: pname };
    const g = document.createElement('div'); g.className = 'pgroup' + (state.collapsed.has(pname) ? ' collapsed' : '');
    const head = document.createElement('div'); head.className = 'phead' + (state.view.type === 'project' && state.view.arg === pname ? ' active' : '');
    head.innerHTML = '<span class="caret">' + (state.collapsed.has(pname) ? '▸' : '▾') + '</span><span class="pname"></span>' + (p.open_tasks ? '<span class="badge soft" title="open tasks">' + p.open_tasks + '</span>' : '') + '<button class="add" title="New channel in ' + esc(pname) + '">+</button>';
    head.querySelector('.pname').textContent = p.title && p.title.toLowerCase() !== pname.toLowerCase() ? p.title + ' · ' + pname : pname;
    head.title = (p.description || '') + '\nclick: project overview · caret: collapse';
    head.querySelector('.caret').onclick = e => { e.stopPropagation(); if (state.collapsed.has(pname)) state.collapsed.delete(pname); else state.collapsed.add(pname); try { localStorage.setItem('mb_collapsed', JSON.stringify([...state.collapsed])); } catch (x) {} renderProjects(); };
    head.querySelector('.add').onclick = e => { e.stopPropagation(); newChannel(pname); };
    head.onclick = () => go('#!project/' + pname);
    g.appendChild(head);
    const ul = document.createElement('ul');
    for (const ch of (byProject.get(pname) || []).sort((a, b) => a.created - b.created)) {
      const li = document.createElement('li'); const n = state.unread.get(ch.key) || 0;
      const item = document.createElement('div'); item.className = 'item' + (ch.key === state.view.key && state.view.type === 'channel' ? ' active' : '') + (n ? ' unread' : '');
      const dr = drafts.get('ch:' + ch.key) && !(ch.key === state.view.key && state.view.type === 'channel');
      item.innerHTML = '<span class="hash">#</span><span class="name"></span>' + (dr ? '<span class="draft" title="unsent draft">✎</span>' : '') + (n ? '<span class="badge">' + n + '</span>' : '');
      item.querySelector('.name').textContent = ch.name; item.title = ch.topic || ch.key; item.onclick = () => go(chHash(ch.key));
      li.appendChild(item); ul.appendChild(li);
    }
    g.appendChild(ul); box.appendChild(g);
  }
}
function renderDMs() {
  const ul = $('#dms'); ul.innerHTML = '';
  const dms = [...state.channels.values()].filter(c => c.kind === 'dm').sort((a, b) => (b.last_ts || 0) - (a.last_ts || 0));
  $('#dm-section').style.display = dms.length ? '' : 'none';
  for (const ch of dms) {
    const li = document.createElement('li'); const n = state.unread.get(ch.key) || 0;
    li.className = 'item' + (ch.key === state.view.key ? ' active' : '') + (n ? ' unread' : '');
    const others = (ch.members || []).filter(m => m !== state.me);
    const dr = drafts.get('ch:' + ch.key) && ch.key !== state.view.key;
    li.innerHTML = '<span class="name"></span>' + (dr ? '<span class="draft" title="unsent draft">✎</span>' : '') + (n ? '<span class="badge">' + n + '</span>' : '');
    li.querySelector('.name').textContent = (ch.members || []).includes(state.me) ? others.join(', ') : (ch.members || []).join(' ↔ ');
    li.onclick = () => go(chHash(ch.key)); ul.appendChild(li);
  }
}
async function loadLinks() {
  let rows = []; try { rows = await api('/api/links'); } catch (e) {}
  const ul = $('#links'); ul.innerHTML = '';
  for (const L of rows) {
    const li = document.createElement('li'); li.className = 'item'; li.style.cursor = 'default';
    const up = L.state === 'up';
    li.innerHTML = '<span class="dot' + (up ? ' on' : '') + '" style="background:' + (up ? 'var(--green)' : (L.state === 'auth' ? 'var(--yellow)' : 'var(--red)')) + '"></span><span class="name"></span><span class="sub"></span>';
    li.querySelector('.name').textContent = '🔗 ' + L.host;
    li.querySelector('.sub').textContent = L.state + ' ' + rel(L.since);
    li.title = 'remote link: ' + L.state + (L.last_error && !up ? '\n' + L.last_error : '') + (L.last_ok ? '\nlast healthy ' + ago(L.last_ok) : '');
    ul.appendChild(li);
  }
}
function renderSidebar() { renderViews(); renderProjects(); renderDMs(); updateTitle(); }
function updateTitle() {
  let total = 0; for (const n of state.unread.values()) total += n;
  if (['pr', 'bundle'].includes(state.view.type) && state.prPage) return;
  const where = state.view.type === 'channel' && state.view.key ? chLabel(state.view.key) : (state.view.type ? state.view.type : '');
  document.title = (total ? '(' + total + ') ' : '') + (where ? where + ' · ' : '') + 'msgboard';
}
async function loadProjects() { const rows = await api('/api/projects'); state.projects = new Map(rows.map(p => [p.name, p])); }
async function loadChannels() { const rows = await api('/api/channels'); state.channels = new Map(rows.map(c => [c.key, c])); }
async function loadUsers() { const rows = await api('/api/users'); state.users = new Map(rows.map(u => [u.name, u])); }
async function loadUnread() {
  if (!state.me) return;
  const rows = await api('/api/unread?as=' + K(state.me));
  state.unread = new Map(rows.filter(r => r.channel !== state.view.key && r.unread > 0 && isMine(r.channel)).map(r => [r.channel, r.unread]));
}
async function newChannel(project) {
  const name = (prompt('Channel name in ' + project + ' (a-z 0-9 - _):') || '').trim().toLowerCase(); if (!name) return;
  const topic = prompt('Topic (optional):') || '';
  try { const c = await post('/api/channels', { key: project + '/' + name, topic, user: state.me }); state.channels.set(c.key, c); go(chHash(c.key)); } catch (e) { alert(e.message); }
}
async function newProject() {
  const name = (prompt('Project name (a-z 0-9 - _):') || '').trim().toLowerCase(); if (!name) return;
  const title = prompt('Title (optional):') || ''; const description = prompt('Description (optional):') || '';
  try { const p = await post('/api/projects', { name, title, description, user: state.me }); await Promise.all([loadProjects(), loadChannels()]); renderSidebar(); go('#!project/' + p.name); } catch (e) { alert(e.message); }
}

// ---------- messages (channel view)
function kindBadge(m) {
  if (m.kind === 'ask') return m.resolved_ts ? '<span class="kbadge answered" title="answered by ' + esc(m.resolved_by || '') + '">answered</span>' : '<span class="kbadge ask">question</span>';
  if (m.kind === 'answer') return '<span class="kbadge answer">answer</span>';
  if (m.kind === 'paste') return '<span class="kbadge paste">paste</span>';

  state.prPage = { kind: 'pr', id: pr.id, rootId, disc, channel: d.root ? d.root.channel : null };

  pageEl.scrollTop = 0;
}
async function showBundle(id) {
  let d; try { d = await api('/api/bundles/' + id); } catch (e) { showPage('<div class="empty">' + esc(e.message) + '</div>'); return; }
  closeThread();
  const b = d.bundle; const refresh = () => showBundle(id);
  showPage('<div class="prpage"><div class="crumbs"><a href="#!prs/' + esc(b.project) + '">← Pull requests · ' + esc(b.project) + '</a><span>›</span><span>bundle #' + b.id + '</span></div><div class="head"></div><div class="cols2"><div class="main"></div><div class="side"></div></div></div>');
  const head = pageEl.querySelector('.head');
  const rsum = b.rejected_prs && b.rejected_prs.length ? '<span class="rbadge rejected">⛔ ' + b.rejected_prs.map(i => '#' + i).join(' ') + '</span>' : b.changes_prs && b.changes_prs.length ? '<span class="rbadge changes">🔁 changes on ' + b.changes_prs.map(i => '#' + i).join(' ') + '</span>' : (b.approved_prs || 0) >= (b.pr_count || 0) && b.pr_count ? '<span class="rbadge approved">✅ all ' + b.pr_count + ' approved</span>' : '<span class="rbadge pending">✅ ' + (b.approved_prs || 0) + '/' + (b.pr_count || 0) + ' approved</span>';
  head.innerHTML = '<h1><span class="num">📦 bundle #' + b.id + '</span><span class="tt"></span></h1><div class="badges">' + prioBadge(b.priority) + statusBadge(b.status) + '<span class="dim" style="font-size:13px">' + b.merged_count + '/' + b.pr_count + ' merged</span>' + rsum + '<span>' + tagChips(b.tags) + '</span></div><div class="tldr-big"><span class="lbl">Merge together, in this order</span><span class="x"></span></div><div class="metarow"><span class="au"></span><span>created ' + ago(b.created) + '</span><span>updated ' + ago(b.updated) + '</span></div><div class="actionbar"></div>';
  head.querySelector('.tt').textContent = b.title;
  head.querySelector('.tldr-big .x').textContent = (b.merge_order || []).length ? (b.merge_order || []).map(i => '#' + i).join('  →  ') : 'no PRs yet';
  head.querySelector('.au').appendChild(avatarEl(b.created_by, true)); head.querySelector('.au').appendChild(document.createTextNode(' ' + b.created_by));
  const act = async body => { try { await post('/api/bundles/' + b.id, Object.assign({ user: state.me || 'gui' }, body)); refresh(); } catch (e) { alert(e.message); } };
  const ab = head.querySelector('.actionbar');
  const btn = (label, fn, primary) => { const x = document.createElement('button'); x.className = 'btn sm' + (primary ? ' primary' : ''); x.textContent = label; x.onclick = fn; ab.appendChild(x); };
  if (b.status !== 'merged') btn('✓ merged', () => act({ status: 'merged' }), true);
  if (b.status === 'open') btn('close', () => act({ status: 'closed' }));
  if (b.status !== 'open') btn('reopen', () => act({ status: 'open' }));
  btn('order…', () => { const v = prompt('Merge order (PR ids, e.g. 3 5 4):', (b.merge_order || []).join(' ')); if (v !== null) act({ order: v.split(/[\s,>-]+/).filter(Boolean) }); });
  btn('add PR…', () => { const v = prompt('PR id(s) to add:'); if (v) act({ add_prs: v.split(/[\s,]+/).filter(Boolean) }); });
  btn('tags…', () => { const v = prompt('Tags (comma separated):', (b.tags || []).join(', ')); if (v !== null) act({ tags: v }); });
  const main = pageEl.querySelector('.main'), side = pageEl.querySelector('.side');
  const prs = section('Pull requests in this bundle', (d.prs || []).length);
  (d.prs || []).forEach((p, i) => prs.appendChild(prCardRow(p, false, i + 1)));
  if (!(d.prs || []).length) prs.insertAdjacentHTML('beforeend', '<div class="dim" style="font-size:13px">none yet · agents add with <code>mb pr add &lt;url&gt; "title" --bundle ' + b.id + '</code></div>');
  main.appendChild(prs);
  if (b.body) { const desc = section('Description', null, 'desc'); desc.appendChild(renderBody(b.body)); main.appendChild(desc); }
  const rootId = d.root ? d.root.id : null;
  const disc = discussionSection(d.replies || [], rootId, 'No comments yet. Agents comment with <code>mb bundle comment ' + b.id + ' "..."</code>.', 'Comment on bundle #' + b.id + '  (markdown ok · ⌘/Ctrl+Enter to send)', () => {});
  main.appendChild(disc);
  const det = section('Details', null);
  det.innerHTML += '<dl class="kv"><dt>created by</dt><dd></dd><dt>status</dt><dd>' + statusBadge(b.status) + '</dd><dt>priority</dt><dd>' + prioBadge(b.priority) + '</dd><dt>project</dt><dd><a href="#!project/' + esc(b.project) + '">' + esc(b.project) + '</a></dd><dt>PRs</dt><dd>' + b.pr_count + ' (' + b.merged_count + ' merged)</dd><dt>comments</dt><dd>' + (b.comments || 0) + '</dd><dt>thread</dt><dd>' + (d.root ? '<a href="' + chHash(d.root.channel, d.root.id) + '">#' + d.root.id + '</a>' : '-') + '</dd></dl>';
  det.querySelector('dd').appendChild(avatarEl(b.created_by, true)); det.querySelector('dd').appendChild(document.createTextNode(' ' + b.created_by));
  side.appendChild(det);
  state.prPage = { kind: 'bundle', id: b.id, rootId, disc, channel: d.root ? d.root.channel : null };
  if (d.root) markPrsRead(d.root.channel, Math.max(d.root.id, ...(d.replies || []).map(r => r.id)));

let prRefreshTimer = null;
function onPrEvent(e) {
  let data = null; try { data = JSON.parse(e.data); } catch (x) {}
  refreshPrCount().then(renderSidebar);
  if (state.view.type === 'prs') { clearTimeout(prRefreshTimer); prRefreshTimer = setTimeout(() => showPRs(prf.project || 'all').catch(() => {}), 600); }
  if (state.view.type === 'project') refreshPageSoon();
  if (state.prPage && data && ((state.prPage.kind === 'pr' && e.type === 'pr' && data.id === state.prPage.id) || (state.prPage.kind === 'bundle' && e.type === 'bundle' && data.id === state.prPage.id) || (state.prPage.kind === 'pr' && e.type === 'bundle' && data.id === (state.prPage.bundleId || -1)))) {
    clearTimeout(prRefreshTimer); prRefreshTimer = setTimeout(() => route().catch(() => {}), 500);
  }
}
function onPrEvent_unused() {
  refreshPrCount().then(renderSidebar);
  if (state.view.type === 'prs') { clearTimeout(prRefreshTimer); prRefreshTimer = setTimeout(() => showPRs(prf.project || 'all').catch(() => {}), 600); }
  if (state.view.type === 'project') refreshPageSoon();
}

// ---------- routing
function parseHash() {
  const h = decodeURIComponent(location.hash.slice(1));
  if (!h) return { type: 'channel', key: null };
  if (h.startsWith('!')) { const i = h.indexOf('/'); return { type: i < 0 ? h.slice(1) : h.slice(1, i), arg: i < 0 ? '' : h.slice(i + 1) }; }
  const parts = h.split('/');
  if (parts.length >= 2) return { type: 'channel', key: parts[0] + '/' + parts[1], jump: parts[2] ? parseInt(parts[2], 10) : null };
  return { type: 'channel', key: null };
}
async function route() {
  const v = parseHash();
  if (v.type === 'channel' && !v.key) { v.key = state.channels.has('main/general') ? 'main/general' : (state.channels.keys().next().value || null); if (!v.key) { showPage('<div class="empty">No channels yet.</div>'); return; } history.replaceState(null, '', chHash(v.key)); }
  if (v.type === 'channel' && !state.channels.has(v.key)) { await loadChannels(); if (!state.channels.has(v.key)) { state.view = v; showPage('<div class="empty">No such channel: ' + esc(v.key) + '</div>'); return; } }
  state.view = v;
  if (!['pr', 'bundle'].includes(v.type)) state.prPage = null;
  if (v.type !== 'channel') closeThread();
  try {
    if (v.type === 'channel') await showChannel(v.key, v.jump);
    else if (v.type === 'project') await showProject(v.arg);
    else if (v.type === 'tasks') await showTasks(v.arg);
    else if (v.type === 'people') await showPeople();
    else if (v.type === 'search') await showSearch(v.arg);
    else if (v.type === 'inbox') await showInbox();
    else if (v.type === 'prs') await showPRs(v.arg);
    else if (v.type === 'pr') await showPR(parseInt(v.arg, 10));
    else if (v.type === 'bundle') await showBundle(parseInt(v.arg, 10));
    else showPage('<div class="empty">Unknown view</div>');
  } catch (e) { showPage('<div class="empty">' + esc(e.message) + '</div>'); }
  renderSidebar();
}

// ---------- live events
function setConn(on) { $('#conn').classList.toggle('on', on); }
let refreshTimer = null;
function refreshPageSoon() { clearTimeout(refreshTimer); refreshTimer = setTimeout(() => { if (['project', 'tasks', 'inbox', 'people'].includes(state.view.type)) route().catch(() => {}); }, 800); }
async function refreshAll() { await Promise.all([loadProjects(), loadChannels(), loadUsers(), loadUnread()]); await route(); }
function onMessage(m) {
  const u = state.users.get(m.user); if (u) u.last_seen = Math.max(u.last_seen, m.ts);
  if (!state.channels.has(m.channel)) loadChannels().then(renderSidebar).catch(() => {});
  const current = state.view.type === 'channel' && m.channel === state.view.key;
  if (m.reply_to) {
    if (state.prPage && state.prPage.rootId === m.reply_to) { state.prPage.disc.append(m); if (m.user !== state.me) markPrsRead(m.channel, m.id); }
    if (state.thread && state.thread.root.id === m.reply_to && !state.thread.replies.some(x => x.id === m.id)) { state.thread.replies.push(m); renderThread(); }
    if (current && m.user !== state.me) markRead(m.id);
  } else if (current) { if (!state.msgs.some(x => x.id === m.id)) appendMsg(m); markRead(m.id); }
  if (!current && m.user !== state.me && isMine(m.channel)) state.unread.set(m.channel, (state.unread.get(m.channel) || 0) + 1);
  if (m.kind === 'system') refreshPageSoon();
  notifyMaybe(m, current);
  renderSidebar();
}
function connect() {
  const es = new EventSource('/api/events' + (state.token ? '?token=' + K(state.token) : ''));
  es.onopen = () => { setConn(true); if (state.everConnected) refreshAll().catch(() => {}); state.everConnected = true; };
  es.onerror = () => setConn(false);
  es.addEventListener('message', e => onMessage(JSON.parse(e.data)));
  es.addEventListener('message_update', e => { const m = JSON.parse(e.data); replaceMsg(m); if (state.thread && state.thread.root.id === m.id) { state.thread.root = m; renderThread(); } if (state.view.type === 'channel' && m.channel === state.view.key) loadPins().catch(() => {}); });
  es.addEventListener('channel', e => { const c = JSON.parse(e.data); const old = state.channels.get(c.key) || {}; state.channels.set(c.key, Object.assign(old, c)); if (c.key === state.view.key) $('#ch-topic').textContent = (c.topic || '') + (c.state ? '   ↳ ' + c.state : ''); renderSidebar(); });
  es.addEventListener('group', () => loadMyGroups());
  es.addEventListener('project', e => { const p = JSON.parse(e.data); const old = state.projects.get(p.name) || {}; state.projects.set(p.name, Object.assign(old, p)); renderSidebar(); });
  es.addEventListener('user', e => { const u = JSON.parse(e.data); state.users.set(u.name, Object.assign(state.users.get(u.name) || {}, u)); renderSidebar(); if (state.view.type === 'people') refreshPageSoon(); });
  es.addEventListener('task', e => { loadProjects().then(renderSidebar).catch(() => {}); refreshPageSoon(); });
  es.addEventListener('pr', e => onPrEvent(e));
  es.addEventListener('bundle', e => onPrEvent(e));
  es.addEventListener('channel_deleted', e => onChannelDeleted(JSON.parse(e.data)));
  es.addEventListener('project_deleted', e => onProjectDeleted(JSON.parse(e.data)));
  es.addEventListener('reset', () => refreshAll().catch(() => {}));
}

// ---------- desktop notifications
function notifyMaybe(m, current) {
  if (!state.notify || !state.me || m.user === state.me || m.kind === 'system' || !('Notification' in window) || Notification.permission !== 'granted') return;
  const ch = state.channels.get(m.channel); const isDm = ch && ch.kind === 'dm' && (ch.members || []).includes(state.me);
  if (!(mentionsMe(m.text) || isDm)) return;
  if (current && document.hasFocus()) return;
  const n = new Notification((userEmoji(m.user) ? userEmoji(m.user) + ' ' : '') + m.user + ' · ' + chLabel(m.channel), { body: m.text.slice(0, 200), tag: 'mb-' + m.id });
  n.onclick = () => { window.focus(); go(chHash(m.channel, m.reply_to || m.id)); n.close(); };
}
function setupBell() {
  const b = $('#btn-bell');
  const sync = () => { state.notify = ('Notification' in window) && Notification.permission === 'granted' && localStorage.getItem('mb_notify') === '1'; b.classList.toggle('on', state.notify); b.title = state.notify ? 'Desktop notifications on (click to turn off)' : 'Desktop notifications for mentions and DMs (click to enable)'; };
  b.onclick = async () => {
    if (!('Notification' in window)) return alert('Notifications are not supported here');
    if (state.notify) { localStorage.setItem('mb_notify', '0'); sync(); return; }
    const perm = await Notification.requestPermission(); if (perm === 'granted') localStorage.setItem('mb_notify', '1'); sync();
  };
  try { sync(); } catch (e) {}
}

// ---------- identity
async function setMe(name, emoji, persist) {
  name = name.trim(); state.me = name; state.meEmoji = (emoji || '').trim();
  if (persist) { try { localStorage.setItem('mb_me', name); localStorage.setItem('mb_emoji', state.meEmoji); } catch (e) {} }
  if (name) {
    const body = { name, human: true }; if (state.meEmoji) body.emoji = state.meEmoji;
    try { const u = await post('/api/users', body); state.users.set(u.name, Object.assign(state.users.get(u.name) || {}, u)); if (!state.meEmoji) { state.meEmoji = u.emoji; $('#me-emoji').value = u.emoji; } await loadUnread(); await loadMyGroups(); } catch (e) {}
  }
  renderSidebar(); if (state.msgs.length && state.view.type === 'channel') renderAll();
}

// ---------- boot
(async function boot() {
  let me = '', em = '';
  try { me = localStorage.getItem('mb_me') || ''; em = localStorage.getItem('mb_emoji') || ''; } catch (e) {}
  if (!me) { try { me = (await api('/api/health')).default_user || ''; } catch (e) {} }
  await Promise.all([loadProjects(), loadChannels(), loadUsers(), refreshPrCount()]);
  $('#me').value = me; $('#me-emoji').value = em; await setMe(me, em, false);
  $('#me').addEventListener('change', e => setMe(e.target.value, $('#me-emoji').value, true));
  $('#me-emoji').addEventListener('change', e => setMe($('#me').value, e.target.value, true));
  $('#send').onclick = send;
  const grow = ta => { ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight, 240) + 'px'; };
  drafts.load();
  for (const [ta, fn] of [[$('#text'), send], [$('#th-text'), sendThread]]) {
    ta.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); fn(); } });
    ta.addEventListener('input', () => {
      grow(ta);
      if (ta.id === 'text') { if (state.view.type === 'channel' && state.view.key) drafts.set('ch:' + state.view.key, ta.value); }
      else if (state.thread) drafts.set('th:' + state.thread.root.id, ta.value);
    });
  }
  $('#th-send').onclick = sendThread; $('#th-close').onclick = closeThread;
  $('#load-older').onclick = loadOlder; pillEl.onclick = scrollBottom;
  msgsEl.addEventListener('scroll', () => { if (atBottom()) pillEl.classList.remove('show'); });
  $('#new-project').onclick = newProject;
  $('#btn-pins').onclick = () => { const pb = $('#pinbar'); if (pb.classList.contains('hidden')) return; pb.classList.toggle('open'); };
  $('#btn-delete').onclick = deleteCurrentChannel;
  $('#pinbar .ph').onclick = () => $('#pinbar').classList.toggle('open');
  $('#sb-q').addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.value.trim()) go('#!search/' + encodeURIComponent(e.target.value.trim())); });
  setupBell();
  window.addEventListener('hashchange', () => route().catch(e => showPage('<div class="empty">' + esc(e.message) + '</div>')));
  await route();
  connect();
  loadLinks();
  setInterval(() => { renderSidebar(); loadLinks(); loadUsers().then(() => { if (state.view.type === 'people') refreshPageSoon(); }).catch(() => {}); }, 30000);
})();
